    <text x="18" y="178" font-family="sans-serif" font-size="10" fill="#ffffff" font-weight="600">Machine Learning Quiz</text>
    <text x="18" y="196" font-family="monospace" font-size="8.5" fill="#10b981">✓ Completed</text>
